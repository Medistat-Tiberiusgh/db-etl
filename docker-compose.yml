services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - '${DB_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 3s
      retries: 10
    networks:
      - edge

  seed:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - seed
    networks:
      - edge

  # Always-on: runs the idempotent yearly API ingest every Sunday 03:30.
  # No data volume — it pulls from the Socialstyrelsen API, not the CSVs.
  scheduler:
    build: .
    command: ['-m', 'scheduler']
    restart: unless-stopped
    # Give the SIGTERM handler time to post the "offline" notification before
    # Docker SIGKILLs it (default grace is 10s; the Discord POST allows 15s).
    stop_grace_period: 20s
    env_file: .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge

volumes:
  pg_data:

networks:
  edge:
    external: true
